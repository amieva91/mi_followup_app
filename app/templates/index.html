{% extends "base/layout.html" %}

{% block title %}Inicio{% endblock %}

{% block extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/audr-storm.css') }}">

    <div class="audr-brand" aria-label="Auðr">

      <a href="{{ url_for('auth.login') }}" class="audr-btn-primary">Iniciar sesión</a>
      <a href="{{ url_for('auth.register') }}" class="audr-btn-secondary">Crear cuenta</a>

</div>
{% endblock %}

{% block extra_js %}
